kind: Deployment
apiVersion: apps/v1
metadata:
  name: test
spec:
  replicas: 1
  selector:
    matchLabels:
      app: name
  template:
    metadata:
      creationTimestamp: null
      labels:
        app: name
    spec:
      volumes:
        - name: static-files
          persistentVolumeClaim:
            claimName: data-kafka-dev-controller-3
      containers:
        - resources: {}
          terminationMessagePath: /dev/termination-log
          name: httpd
          securityContext:
            capabilities:
              drop:
                - ALL
            allowPrivilegeEscalation: false
          ports:
            - containerPort: 8080
              protocol: TCP
          imagePullPolicy: Always
          volumeMounts:
            - name: static-files
              mountPath: /var/www/html
          terminationMessagePolicy: File
          image: 'image-registry.openshift-image-registry.svc:5000/openshift/httpd:latest'
      restartPolicy: Always
      terminationGracePeriodSeconds: 30
      dnsPolicy: ClusterFirst
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      schedulerName: default-scheduler
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 25%
      maxSurge: 25%
  revisionHistoryLimit: 10
  progressDeadlineSeconds: 600
